# _quarto.yml
my_global_folders:
    USER_OUTPUT_FOLDER: "../zzz_zzz_USER_OUPUT_FOLDER"

list_input_file_path:
    str_file_path_Env_RData: "../zzz_zzz_USER_OUPUT_FOLDER/zzz_output_report01_RQuarto_00_Env.RData"
    str_file_path_report01_qmd: "../zzz_zzz_USER_OUPUT_FOLDER/report01_RQuarto_00.qmd"
    str_file_path_report02_R_script: "../zzz_zzz_USER_OUPUT_FOLDER/zzz_output_report02_R_script.qmd"
    
project:
  type: default
  pre-render:
    - "Rscript script_R_01_pre_render.R"
  post-render:
    - "Rscript script_R_02_post_render.R"
  render:
    - "*.qmd"
    - "!drafts/*"
    - "!part00_header/**"
    - "!part01_init/**"
    - "!part02_theory/**"
    
  # preview:
  #   port: 8888
  #   browser: false
  # Variables que usarán los scripts

format:
  html:
    output-file: "zzz_output_report99_Rscience_Report_00.html"
    theme: cosmo
    css:
      - ../common_files/custom_theme.css
    toc: true
    toc-float: true
    toc-location: right
    number-sections: true
    self-contained: true
    embed-resources: true
    include-in-header:
      text: |
        <meta name="viewport" content="width=device-width, initial-scale=1">
    fig-format: svg
    code-copy: true
    code-link: true
    grid:
      body-width: 2000px
      margin-width: 250px
      gutter-width: 1.5rem
      

