# _quarto.yml
my_global_folders:
    USER_OUTPUT_FOLDER: "../zzz_zzz_USER_OUPUT_FOLDER"
    
list_output_file_names:
    str_file_name_Env_RData: "zzz_output_report01_RQuarto_00_Env.RData"
project:
  type: default
  pre-render:
    - "Rscript script_R_01_pre_render.R"
  post-render:
    - "Rscript script_R_02_post_render.R"
  render:
    - "*.qmd"
    - "!drafts/*"
  preview:
    port: 8888
    browser: false
format:
  html:
    output-file: "zzz_output_report01_RQuarto_00.html"
    theme: cosmo
    css: ../common_files/custom_theme.css
    grid:
      body-width: 2000px
      margin-width: 250px
      gutter-width: 1.5rem
    self-contained: true
    link-citations: true
    toc: true
    toc-depth: 2
    toc-title: "Index"
    toc-location: left
execute:
  # ¡FORZAR EJECUCIÓN COMPLETA SIEMPRE!
  freeze: false        # "false" = siempre ejecutar, "auto" = verifica cambios
  cache: false         # Desactivar cache completamente

  # Control de visualización
  echo: true           # TRUE para ver el código
  warning: true        # Ver warnings
  error: true          # Ver errores (con FALSE se continúa)
  message: true        # Ver mensajes
  include: true        # TRUE para incluir resultados

  # Figuras
  fig-show: "show"     # "show" para ver figuras
  fig-cap-location: "bottom"

  # Código
  code-fold: false
  code-overflow: "wrap"
  code-link: true

knitr:
  opts_chunk:
    collapse: false
    comment: ""
