# _quarto.yml
my_global_folders:
    USER_OUTPUT_FOLDER: "../zzz_zzz_USER_OUPUT_FOLDER"
    png_folder: "zzz_output_report02_R_png_folder"

list_input_file_path:
    str_file_path_RData: "../zzz_zzz_USER_OUPUT_FOLDER/zzz_output_report01_RQuarto_00_Env.RData"
    str_file_path_report01_qmd: "../report01_RQuarto_HERE/report01_RQuarto_00.qmd"

list_output_file_name:
    str_file_name_R_script: "zzz_output_report02_R_script.R"
    str_file_name_png_folder_zipped: "zzz_output_report02_R_png_folder.zip"


project:
  type: default
  pre-render:
    - "Rscript script_R_01_pre_render.R"
  post-render:
    - "Rscript script_R_02_post_render.R"
  render:
    - "*.qmd"
    - "!drafts/*"
  preview:
    port: 8888
    browser: false
  # Variables que usarán los scripts

format:
  html:
    output-file: "zzz_output_report02_R_00_silenced.html"
    theme: cosmo
    css:
      - ../common_files/custom_theme.css
    toc: true
    toc-float: true
    toc-location: right
    number-sections: true
    self-contained: true
    embed-resources: true
    include-in-header:
      text: |
        <meta name="viewport" content="width=device-width, initial-scale=1">
    fig-format: svg
    code-copy: true
    code-link: true
    grid:
      body-width: 2000px
      margin-width: 250px
      gutter-width: 1.5rem
  pdf:
    keep-tex: true

execute:
  enabled: true
  echo: true
  warning: true
  error: true
  message: true
  include: true
  eval: true
  cache: false
  freeze: false
  debug: false







knitr:
  opts_chunk:
    collapse: false
    comment: ""
    dev: "svg"
    out.width: "100%"
    fig.align: "center"
    cache: false

metadata:
  lang: en
  author: "Rscience"
  date: today
