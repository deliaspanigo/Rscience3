# _quarto.yml
# Local inputs
local_inputs:
    list_local_input_files:
        quarto_config: "_quarto.yml"
        qmd_run:       "report02_pdf.qmd"
        pre_script:    "script_R_01_pre_render.R"
        post_script:   "script_R_02_post_render.R"
        deep_clean:    "_deep_clean.R"
        list_local_input_folders: null
    str_regex_save_files: '.*\.Rproj$'

# External inputs
external_inputs:
    list_external_input_file_path:
        str_RData: "../zzz_zzz_output/zzz_output_report01_R_internal_00_Env.RData"

# Local Outputs
local_outputs:
    str_regex_inclusion_files:  "^zzz_output_"
    str_regex_exclusion_files:  "silenced"
    str_regex_inclusion_folders: "^zzz_output_"
    str_regex_exclusion_folders:  "silenced"
    str_copy_qmd_file_name: "report01_RQuarto_00_copy_PROD.qmd"
    str_R_script_internal: "zzz_output_report01_R_script_internal.R"
    str_R_script_external: "zzz_output_report01_R_script_external.R"
    str_png_folder: "zzz_output_report02_R_png_folder"
    
# External Outputs
external_output:
    str_user_output_folder_path: "../zzz_zzz_output"

################################################################################
project:
  type: default
  pre-render:
    - "Rscript script_R_01_pre_render.R"
  post-render:
    - "Rscript script_R_02_post_render.R"
  render:
    - "report02_pdf.qmd"
    # - "*.qmd"
    - "!drafts/*"
    - "!report01_NO_CONFIG_gen_files_silenced.qmd"
  preview:
    port: 8888
    browser: false
  # Variables que usarán los scripts

format:
  pdf:
    toc: true
    toc-depth: 2
    number-sections: true
    output-file: "zzz_output_report02_pdf_00.pdf"
    theme: cosmo
    css:
      - ../common_files/custom_theme.css
    keep-tex: true

execute:
  enabled: true
  echo: true
  warning: true
  error: true
  message: true
  include: true
  eval: true
  cache: false
  freeze: false
  debug: false







knitr:
  opts_chunk:
    collapse: false
    comment: ""
    dev: "svg"
    out.width: "100%"
    fig.align: "center"
    cache: false

metadata:
  lang: en
  author: "Rscience"
  date: today
